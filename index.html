<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f6ef7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Rekapitulasi Keuangan Anak</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- jsPDF + AutoTable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Rekapitulasi Keuangan Anak</h1>
            
            <div class="form-container">
                <!-- Tahun -->
                <div class="year-container">
                    <label class="year-label">Tahun</label>
                    <input type="number" id="yearInput" class="year-input" value="2026" min="2000" max="2100" inputmode="numeric" pattern="[0-9]*">
                </div>
                
                <!-- Tabel -->
                <div class="table-wrapper" id="tableWrapper">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Anak</th>
                                <th>Bulan</th>
                                <th>Jumlah</th>
                                <th>Keterangan</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Baris ditambahkan oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Total -->
                <div class="total-container">
                    <span class="total-label">Total</span>
                    <span class="total-amount" id="totalAmount">Rp0</span>
                </div>
                
                <!-- Tombol -->
                <div class="button-group">
                    <button type="button" class="btn btn-add" id="addRowBtn">+ Tambah Anak</button>
                    <button type="button" class="btn btn-generate" id="generatePDFBtn">Generate PDF</button>
                </div>
                
                <div id="errorMessages" class="error-messages"></div>
                <div id="successMessage" class="success-message"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
